name: Python package

on: [push, pull_request]

jobs:

  test-python:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync
    - name: Test
      run: |
        uv run python -m unittest

  typecheck:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync
    - name: Typecheck
      run: |
        uv run mypy

  test-python-sdist:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync
    - name: Test
      run: |
        uv run make test-sdist
    - name: Check the package description
      run: |
        uvx twine check --strict dist/*.tar.gz

  examples:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync
    - name: Test
      run: |
        uv run python examples/benchmarks/codecs.py
        uv run python examples/hello_world.py
        uv run python examples/x509_pem.py
        uv run python examples/compact_extensions_uper/main.py
        uv run python examples/programming_types/main.py

  release:
    needs: [test-python, typecheck, test-python-sdist, examples]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')
    permissions:
      # Required for PyPI trusted publishing.
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Build a binary wheel and a source tarball
      run: |
        uv build
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
